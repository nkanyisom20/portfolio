<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Nkanyiso Mkhize</title>
  <meta http-equiv="refresh" content="5; url=https://nkanyisom20.github.io/portfolio/">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="assets/css/style_thanks.css" rel="stylesheet">
</head>
<body>

  <div class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">
    <div class="thanks-box">
      <div class="check-icon">
        <i class="bi bi-check-lg"></i>
      </div>
      <h2 class="fw-bold">Thank You!</h2>
      <p class="text-muted mt-3">Your message has been sent successfully. I will get back to you within 24 hours.</p>
     
      <p class="small text-muted mt-3">Redirecting to home in <span id="countdown">5</span> seconds...</p>

      <a href="https://nkanyisom20.github.io/portfolio/index.html" class="btn btn-primary rounded-pill px-4 py-2 mt-2">
        <i class="bi bi-arrow-left me-2"></i>Back to Portfolio
      </a>

      <p class="small text-muted mt-4 mb-0">© 2026 Nkanyiso Mkhize | Backend Developer</p>
    </div>
  </div>

  <footer class="py-4 bg-dark text-white text-center">
    <small>© 2026 Nkanyiso Mkhize | Backend Developer | South African</small>
  </footer>

  <script>
    let seconds = 5;
    const el = document.getElementById('countdown');
    setInterval(() => {
      seconds--;
      if (seconds >= 0) el.textContent = seconds;
      if (seconds <= 0) window.location.href = "https://nkanyisom20.github.io/portfolio/index.html";
    }, 1000);
  </script>

</body>
</html>
